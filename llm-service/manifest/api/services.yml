apiVersion: v1
kind: Service
metadata:
  name: llm-api-svc
  labels:
    app: llm-service
    component: api
spec:
  selector:
    app: llm-service
    component: api
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
  type: LoadBalancer

---
apiVersion: v1
kind: Service
metadata:
  name: postgres-svc
  labels:
    app: llm-service
    component: postgres
spec:
  selector:
    app: llm-service
    component: postgres
  ports:
    - protocol: TCP
      port: 5432
      targetPort: 5432
  type: LoadBalancer
